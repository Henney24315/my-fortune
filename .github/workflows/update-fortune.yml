name: Update daily fortune

on:
  schedule:
    - cron: '15 15 * * *' # 00:15 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node scripts/build-fortune.js
        env:
          PROFILE_GENDER: ${{ secrets.PROFILE_GENDER }}
          PROFILE_SL_CAL: ${{ secrets.PROFILE_SL_CAL }}
          PROFILE_BIRTH_YEAR: ${{ secrets.PROFILE_BIRTH_YEAR }}
          PROFILE_BIRTH_MONTH: ${{ secrets.PROFILE_BIRTH_MONTH }}
          PROFILE_BIRTH_DAY: ${{ secrets.PROFILE_BIRTH_DAY }}
          PROFILE_BIRTH_HOUR: ${{ secrets.PROFILE_BIRTH_HOUR }}

      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fortune.json
          git diff --staged --quiet || git commit -m "chore: update daily fortune"
          git push
