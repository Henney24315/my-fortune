<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오늘의 운세</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    color: #222;
  }
  h1 {
    font-size: clamp(20px, 6vw, 24px);
    margin-bottom: 16px;
  }
  .highlight {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 20px;
  }
  .highlight-card {
    background: linear-gradient(135deg, #6b46c1, #9061e0);
    color: #fff;
    border-radius: 12px;
    padding: 16px 8px;
    text-align: center;
  }
  .highlight-card .label {
    font-size: 12px;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  .highlight-card .value {
    font-size: clamp(18px, 6vw, 24px);
    font-weight: 700;
    line-height: 1.2;
    word-break: keep-all;
  }
  .highlight-note {
    grid-column: 1 / -1;
    text-align: center;
    padding: 12px 8px;
  }
  .highlight-note .value {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    word-break: keep-all;
  }
  .section {
    margin-top: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid #eee;
  }
  .section h2 {
    font-size: 16px;
    margin: 0 0 8px;
    color: #6b46c1;
  }
  .section p {
    margin: 0;
    line-height: 1.6;
    font-size: 14px;
    white-space: pre-wrap;
  }
  .error {
    color: #c0392b;
    margin-top: 16px;
  }
  .loading {
    color: #888;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <h1>오늘의 운세</h1>
  <div id="highlight"></div>
  <div id="result"><p class="loading">불러오는 중...</p></div>

  <script>
    const highlight = document.getElementById('highlight');
    const result = document.getElementById('result');

    (async () => {
      try {
        const res = await fetch('./fortune.json', { cache: 'no-store' });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '요청 실패');
        }

        const h = data.highlight;
        if (h) {
          highlight.innerHTML = `
            <div class="highlight">
              <div class="highlight-card">
                <div class="label">날짜</div>
                <div class="value">${h.date}</div>
              </div>
              <div class="highlight-card">
                <div class="label">오늘의 확률</div>
                <div class="value">${h.percentage}</div>
              </div>
              <div class="highlight-card">
                <div class="label">행운의 색상</div>
                <div class="value">${h.color}</div>
              </div>
              ${h.colorNote ? `
              <div class="highlight-card highlight-note">
                <div class="label">색상 관련 조언</div>
                <div class="value">${h.colorNote}</div>
              </div>
              ` : ''}
            </div>
          `;
        }

        result.innerHTML = '';
        for (const { title, content } of data.sections) {
          const div = document.createElement('div');
          div.className = 'section';
          div.innerHTML = `<h2>${title}</h2><p>${content}</p>`;
          result.appendChild(div);
        }
      } catch (err) {
        result.innerHTML = `<p class="error">${err.message}</p>`;
      }
    })();
  </script>
</body>
</html>
