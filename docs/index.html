<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오늘의 운세</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    color: #222;
  }
  h1 {
    font-size: clamp(20px, 6vw, 24px);
    margin-bottom: 16px;
  }
  h2.section-tit {
    font-size: 15px;
    margin: 28px 0 10px;
    color: #444;
  }
  .highlight {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .highlight-card {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px 8px;
    text-align: center;
  }
  .highlight-card .label {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }
  .highlight-card .value {
    font-size: clamp(16px, 5.5vw, 22px);
    font-weight: 700;
    line-height: 1.2;
    word-break: keep-all;
    color: #222;
  }
  .highlight-note {
    grid-column: 1 / -1;
    text-align: center;
    padding: 12px 8px;
  }
  .highlight-note .value {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    word-break: keep-all;
  }
  .energy-tag {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    word-break: keep-all;
  }
  .color-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }
  .color-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border: 1px solid #ddd;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: #333;
  }
  .color-tag .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.2);
  }
  .day-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .day-card {
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 10px 14px;
  }
  .day-card .day-head {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 13px;
    color: #444;
    margin-bottom: 4px;
  }
  .day-card p {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: #333;
  }
  .error {
    color: #c0392b;
    margin-top: 16px;
  }
  .loading {
    color: #888;
    margin-top: 16px;
  }
  .gate {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 40px;
  }
  .gate input {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  .gate button {
    width: 100%;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #6b46c1;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="gate" class="gate">
    <p>비밀번호를 입력하세요</p>
    <input type="password" id="gate-pw" autocomplete="off">
    <button id="gate-btn">확인</button>
    <p id="gate-error" class="error" hidden>비밀번호가 틀렸습니다.</p>
  </div>

  <div id="app" hidden>
    <h1>오늘의 운세</h1>
    <div id="result"><p class="loading">불러오는 중...</p></div>
  </div>

  <script>
    const GATE_PASSWORD = '880204';
    const GATE_KEY = 'fortune_gate_ok';

    const gate = document.getElementById('gate');
    const app = document.getElementById('app');
    const gatePw = document.getElementById('gate-pw');
    const gateBtn = document.getElementById('gate-btn');
    const gateError = document.getElementById('gate-error');
    const result = document.getElementById('result');

    const COLOR_MAP = {
      '흰색': '#ffffff', '하얀색': '#ffffff',
      '검은색': '#222222', '까만색': '#222222',
      '빨간색': '#e53935', '홍색': '#e53935',
      '주황색': '#fb8c00',
      '노란색': '#fdd835',
      '초록색': '#43a047', '녹색': '#43a047',
      '파란색': '#1e88e5',
      '남색': '#1a237e', '곤색': '#1a237e', '진곤색': '#0d1b4c',
      '보라색': '#8e24aa', '자주색': '#8e24aa',
      '분홍색': '#ec407a',
      '갈색': '#6d4c41',
      '회색': '#9e9e9e',
      '은색': '#c0c0c0',
      '금색': '#d4af37',
      '하늘색': '#4fc3f7',
      '연두색': '#9ccc65',
    };

    const SCORE_COLORS = {
      90: '#2275bd',
      80: '#1b99af',
      70: '#039ad8',
      60: '#0c9802',
      50: '#887c01',
      40: '#e55506',
      30: '#fe2400',
    };
    const SCORE_FALLBACK_COLOR = '#cc162c';

    function colorTags(colorStr) {
      return colorStr
        .split(',')
        .map((raw) => raw.trim())
        .filter(Boolean)
        .map((name) => {
          const hex = COLOR_MAP[name] || '#cccccc';
          return `<span class="color-tag"><span class="swatch" style="background:${hex}"></span>${name}</span>`;
        })
        .join('');
    }

    function energyTag(h) {
      if (!h.scoreLabel) return '';
      const bg = SCORE_COLORS[h.score] || SCORE_FALLBACK_COLOR;
      const specialText = h.specialDay ? ` · ${h.specialDay}` : '';
      return `<span class="energy-tag" style="background:${bg}">${h.scoreLabel}${specialText}</span>`;
    }

    function colorizeWeekday(dateStr) {
      return dateStr.replace(/\(([월화수목금토일])\)/, (match, wd) => {
        const color = wd === '토' ? '#1e88e5' : wd === '일' ? '#e53935' : '#222';
        return `(<span style="color:${color}">${wd}</span>)`;
      });
    }

    function renderHighlight(title, h) {
      const note = h.colorNote ? `
        <div class="highlight-card highlight-note">
          <div class="label">색상 관련 조언</div>
          <div class="value">${h.colorNote}</div>
        </div>` : '';

      return `
        <h2 class="section-tit">${title}</h2>
        <div class="highlight">
          <div class="highlight-card">
            <div class="label">날짜</div>
            <div class="value">${colorizeWeekday(h.date)}</div>
          </div>
          <div class="highlight-card">
            <div class="label">확률 · 기운</div>
            <div class="value">${h.percentage}</div>
            ${energyTag(h)}
          </div>
          <div class="highlight-card">
            <div class="label">행운의 색상</div>
            <div class="value color-tags">${colorTags(h.color)}</div>
          </div>
          ${note}
        </div>
      `;
    }

    function formatDayScore(day) {
      if (day.score === day.scoreLabel) return day.score;
      return `${day.score}점 (${day.scoreLabel})`;
    }

    async function loadFortune() {
      try {
        const res = await fetch('./fortune.json', { cache: 'no-store' });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '요청 실패');
        }

        let html = '';
        html += renderHighlight('오늘', data.today);
        html += renderHighlight('내일', data.tomorrow);

        html += '<h2 class="section-tit">앞으로 7일간의 운세</h2><div class="day-list">';
        for (const day of data.next7Days) {
          const specialText = day.specialDay ? ` · ${day.specialDay}` : '';
          html += `
            <div class="day-card">
              <div class="day-head"><span>${colorizeWeekday(day.date)}</span><span>${formatDayScore(day)}${specialText}</span></div>
              <p>${day.content}</p>
            </div>
          `;
        }
        html += '</div>';

        result.innerHTML = html;
      } catch (err) {
        result.innerHTML = `<p class="error">${err.message}</p>`;
      }
    }

    function unlock() {
      gate.hidden = true;
      app.hidden = false;
      loadFortune();
    }

    function tryPassword() {
      if (gatePw.value === GATE_PASSWORD) {
        localStorage.setItem(GATE_KEY, '1');
        unlock();
      } else {
        gateError.hidden = false;
      }
    }

    gateBtn.addEventListener('click', tryPassword);
    gatePw.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryPassword();
    });

    if (localStorage.getItem(GATE_KEY) === '1') {
      unlock();
    }
  </script>
</body>
</html>
