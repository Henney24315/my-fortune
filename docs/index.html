<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오늘의 운세</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    color: #222;
  }
  h1 {
    font-size: clamp(20px, 6vw, 24px);
    margin-bottom: 16px;
  }
  h2.section-tit {
    font-size: 15px;
    margin: 28px 0 10px;
    color: #444;
  }
  .highlight {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .highlight-card {
    background: linear-gradient(135deg, #6b46c1, #9061e0);
    color: #fff;
    border-radius: 12px;
    padding: 16px 8px;
    text-align: center;
  }
  .highlight-card .label {
    font-size: 12px;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  .highlight-card .value {
    font-size: clamp(16px, 5.5vw, 22px);
    font-weight: 700;
    line-height: 1.2;
    word-break: keep-all;
  }
  .highlight-note {
    grid-column: 1 / -1;
    text-align: center;
    padding: 12px 8px;
  }
  .highlight-note .value {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    word-break: keep-all;
  }
  .day-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .day-card {
    background: #f5f2fc;
    border-radius: 10px;
    padding: 10px 14px;
  }
  .day-card .day-head {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 13px;
    color: #6b46c1;
    margin-bottom: 4px;
  }
  .day-card p {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: #333;
  }
  .error {
    color: #c0392b;
    margin-top: 16px;
  }
  .loading {
    color: #888;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <h1>오늘의 운세</h1>
  <div id="result"><p class="loading">불러오는 중...</p></div>

  <script>
    const result = document.getElementById('result');

    function renderHighlight(title, h) {
      const note = h.colorNote ? `
        <div class="highlight-card highlight-note">
          <div class="label">색상 관련 조언</div>
          <div class="value">${h.colorNote}</div>
        </div>` : '';

      const energyParts = [h.scoreLabel, h.specialDay].filter(Boolean);
      const energy = energyParts.length ? `
        <div class="highlight-card highlight-note">
          <div class="label">기운</div>
          <div class="value">${energyParts.join(' · ')}</div>
        </div>` : '';

      return `
        <h2 class="section-tit">${title}</h2>
        <div class="highlight">
          <div class="highlight-card">
            <div class="label">날짜</div>
            <div class="value">${h.date}</div>
          </div>
          <div class="highlight-card">
            <div class="label">확률</div>
            <div class="value">${h.percentage}</div>
          </div>
          <div class="highlight-card">
            <div class="label">행운의 색상</div>
            <div class="value">${h.color}</div>
          </div>
          ${note}
          ${energy}
        </div>
      `;
    }

    function formatDayScore(day) {
      if (day.score === day.scoreLabel) return day.score;
      return `${day.score}점 (${day.scoreLabel})`;
    }

    (async () => {
      try {
        const res = await fetch('./fortune.json', { cache: 'no-store' });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '요청 실패');
        }

        let html = '';
        html += renderHighlight('오늘', data.today);
        html += renderHighlight('내일', data.tomorrow);

        html += '<h2 class="section-tit">앞으로 7일간의 운세</h2><div class="day-list">';
        for (const day of data.next7Days) {
          const specialText = day.specialDay ? ` · ${day.specialDay}` : '';
          html += `
            <div class="day-card">
              <div class="day-head"><span>${day.date}</span><span>${formatDayScore(day)}${specialText}</span></div>
              <p>${day.content}</p>
            </div>
          `;
        }
        html += '</div>';

        result.innerHTML = html;
      } catch (err) {
        result.innerHTML = `<p class="error">${err.message}</p>`;
      }
    })();
  </script>
</body>
</html>
