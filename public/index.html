<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>오늘의 운세</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: -apple-system, "Malgun Gothic", sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    color: #222;
  }
  h1 {
    font-size: clamp(20px, 6vw, 24px);
    margin-bottom: 16px;
  }
  h2.section-tit {
    font-size: 15px;
    margin: 28px 0 10px;
    color: #444;
  }
  button {
    width: 100%;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #6b46c1;
    color: #fff;
    cursor: pointer;
  }
  button:disabled {
    background: #b3a1d6;
    cursor: default;
  }
  .highlight {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .highlight-card {
    border: 1px solid #e5e5e5;
    border-radius: 12px;
    padding: 16px 8px;
    text-align: center;
  }
  .highlight-card .label {
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
  }
  .highlight-card .value {
    font-size: clamp(16px, 5.5vw, 22px);
    font-weight: 700;
    line-height: 1.2;
    word-break: keep-all;
    color: #222;
  }
  .highlight-note {
    grid-column: 1 / -1;
    text-align: center;
    padding: 12px 8px;
  }
  .highlight-note .value {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.5;
    word-break: keep-all;
  }
  .color-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
  }
  .color-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border: 1px solid #ddd;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    color: #333;
  }
  .color-tag .swatch {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid rgba(0, 0, 0, 0.2);
  }
  .day-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .day-card {
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    padding: 10px 14px;
  }
  .day-card .day-head {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 13px;
    color: #444;
    margin-bottom: 4px;
  }
  .day-card p {
    margin: 0;
    font-size: 12px;
    line-height: 1.5;
    color: #333;
  }
  .error {
    color: #c0392b;
    margin-top: 16px;
  }
</style>
</head>
<body>
  <h1>오늘의 운세</h1>
  <button id="load-btn">운세 보기</button>
  <div id="result"></div>

  <script>
    const btn = document.getElementById('load-btn');
    const result = document.getElementById('result');

    const COLOR_MAP = {
      '흰색': '#ffffff', '하얀색': '#ffffff',
      '검은색': '#222222', '까만색': '#222222',
      '빨간색': '#e53935', '홍색': '#e53935',
      '주황색': '#fb8c00',
      '노란색': '#fdd835',
      '초록색': '#43a047', '녹색': '#43a047',
      '파란색': '#1e88e5',
      '남색': '#1a237e', '곤색': '#1a237e', '진곤색': '#0d1b4c',
      '보라색': '#8e24aa', '자주색': '#8e24aa',
      '분홍색': '#ec407a',
      '갈색': '#6d4c41',
      '회색': '#9e9e9e',
      '은색': '#c0c0c0',
      '금색': '#d4af37',
      '하늘색': '#4fc3f7',
      '연두색': '#9ccc65',
    };

    function colorTags(colorStr) {
      return colorStr
        .split(',')
        .map((raw) => raw.trim())
        .filter(Boolean)
        .map((name) => {
          const hex = COLOR_MAP[name] || '#cccccc';
          return `<span class="color-tag"><span class="swatch" style="background:${hex}"></span>${name}</span>`;
        })
        .join('');
    }

    function renderHighlight(title, h) {
      const note = h.colorNote ? `
        <div class="highlight-card highlight-note">
          <div class="label">색상 관련 조언</div>
          <div class="value">${h.colorNote}</div>
        </div>` : '';

      const energyParts = [h.scoreLabel, h.specialDay].filter(Boolean);
      const energy = energyParts.length ? `
        <div class="highlight-card highlight-note">
          <div class="label">기운</div>
          <div class="value">${energyParts.join(' · ')}</div>
        </div>` : '';

      return `
        <h2 class="section-tit">${title}</h2>
        <div class="highlight">
          <div class="highlight-card">
            <div class="label">날짜</div>
            <div class="value">${h.date}</div>
          </div>
          <div class="highlight-card">
            <div class="label">확률</div>
            <div class="value">${h.percentage}</div>
          </div>
          <div class="highlight-card">
            <div class="label">행운의 색상</div>
            <div class="value color-tags">${colorTags(h.color)}</div>
          </div>
          ${note}
          ${energy}
        </div>
      `;
    }

    function formatDayScore(day) {
      if (day.score === day.scoreLabel) return day.score;
      return `${day.score}점 (${day.scoreLabel})`;
    }

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = '불러오는 중...';
      result.innerHTML = '';

      try {
        const res = await fetch('/api/fortune');
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || '요청 실패');
        }

        let html = '';
        html += renderHighlight('오늘', data.today);
        html += renderHighlight('내일', data.tomorrow);

        html += '<h2 class="section-tit">앞으로 7일간의 운세</h2><div class="day-list">';
        for (const day of data.next7Days) {
          const specialText = day.specialDay ? ` · ${day.specialDay}` : '';
          html += `
            <div class="day-card">
              <div class="day-head"><span>${day.date}</span><span>${formatDayScore(day)}${specialText}</span></div>
              <p>${day.content}</p>
            </div>
          `;
        }
        html += '</div>';

        result.innerHTML = html;
      } catch (err) {
        result.innerHTML = `<p class="error">${err.message}</p>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '운세 보기';
      }
    });
  </script>
</body>
</html>
